# US14 · Ingestão programada: toda segunda-feira baixa a síntese semanal da ANP,
# reavalia o modelo de preço nas últimas semanas e falha (notificando o dono)
# se o erro passar do limite do RNF06. Também pode ser disparado à mão.
name: atualizar-precos

on:
  schedule:
    - cron: "17 9 * * 1"   # segundas, 09:17 UTC (06:17 em Brasília)
  workflow_dispatch:

jobs:
  monitorar:
    name: baixar série da ANP e reavaliar o modelo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Baixar a publicação da ANP e reavaliar
        run: python -m src.monitor
      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-precos
          path: dados/saida/monitor_precos.*
